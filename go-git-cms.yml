# Sample Site — a personal profile template's content model.
#
# ── Why the anchors ─────────────────────────────────────────────────────────
#
# Four content models on this site carry SEO metadata, and every one of them
# wants the same six fields. Writing them out four times is how they drift: the
# fifth model gets `ogImage` instead of `image`, and the site's <head> quietly
# renders nothing for it.
#
# So the SEO block is declared once as a YAML anchor (`&seo`) and aliased into
# every model that needs it (`*seo`). The CMS never sees the anchor — YAML
# resolves aliases while parsing, so what reaches the importer is four
# identical, fully-expanded field lists. That is the point: the repetition
# still exists in the data, it just no longer exists in the file you maintain.
#
# ── Where anchors have to live ──────────────────────────────────────────────
#
# Anchors are usually parked in a top-level `x-definitions:` block. That does
# not work here: this config's schema is closed (`additionalProperties: false`),
# so an undeclared top-level key is rejected before anything else is checked.
#
# The alternative is what this file does — declare each anchor at its *first
# real use* and alias it afterwards. Slightly less tidy to read, but it needs
# no support from the config format and nothing to keep in sync.
#
# ── Two forms, and when to use which ────────────────────────────────────────
#
#   *name        a plain alias — an exact copy. Right when every use is
#                identical, which is the case for `seo`.
#
#   <<: *name    a merge key — copy, then override some keys. Right when the
#                shape repeats but the name or label must differ, which is the
#                case for media references and the shared CTA block.
#
# Component ↔ type rules (enforced on import): string → input | textarea | body |
# slug | email | url | date | datetime | select | media | reference; boolean →
# checkbox | switch; integer/float → number | stepper | telephone | date |
# datetime | select; array → list | mixedList; object → inlineGroup | group |
# media | reference.

version: 1

# ── Media ───────────────────────────────────────────────────────────────────
# Astro serves everything under public/ from the site root, so
# public/images/a.png is fetched as /images/a.png. `public_base` records that
# transformation, which is what lets a media field store the URL the site uses
# while the CMS still knows which repository file it refers to.
media:
  - name: images
    path: "public/images/**/*.{png,jpg,jpeg,webp,avif,svg}"
    mime_types: ["image/*"]
    public_base: /images

content_models:
  # ── Articles ──────────────────────────────────────────────────────────────
  - name: articles
    label: "{{title}}"
    path: "src/content/articles/*.md"
    filename: "{{slug}}"
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        display: { component: slug }

      - name: publishDate
        label: Published
        type: string
        required: true
        display: { component: date }

      - name: updateDate
        label: Updated
        type: string
        display: { component: date }

      - name: draft
        label: Draft
        type: boolean
        display: { component: switch }

      - name: featured
        label: Feature on the homepage
        type: boolean
        display: { component: switch }

      - name: excerpt
        label: Excerpt
        type: string
        display: { component: textarea }

      - name: tags
        label: Tags
        type: array
        of: string
        display: { component: list }

      # Related reading: pointers at other articles, keyed by path. Nothing is
      # copied — the article page resolves each key against the collection
      # (src/lib/content.ts, getRelated) — so a retitled article needs no
      # rewrite here, and deleting one that is listed somewhere clears it from
      # the list (on_delete: unset) rather than refusing. The array stays a
      # `list`; `display.item` is what makes each row a document picker, and
      # the `reference:` block describes what those items point at.
      - name: related
        label: Related articles
        type: array
        of: string
        display:
          component: list
          item: { component: reference }
        reference: { collection: articles, on_delete: unset }
        max_items: 3

      # FIRST USE of the media-reference shape. The object form stores
      # {id, public_path, cdn_path}: the id is authoritative, so the reference
      # survives the file being renamed, and the paths are copies the built site
      # reads without calling the CMS. Those three children are fixed and
      # required — exactly the kind of boilerplate worth anchoring. `display`
      # names the control; the `media:` block beside it names the set, because
      # which set (and, on a string field, which path form) is a contract the
      # server enforces rather than a display hint.
      - &mediaRef
        name: cover
        label: Cover image
        type: object
        display: { component: media }
        media: { set: images }
        fields:
          - { name: id, type: string }
          - { name: public_path, type: string }
          - { name: cdn_path, type: string }

      # FIRST USE of the SEO block. Everything below aliases this.
      - &seo
        name: seo
        label: SEO
        type: object
        display: { component: group }
        fields:
          - name: title
            label: Meta title
            type: string
            display: { component: input }
          - name: description
            label: Meta description
            type: string
            display: { component: textarea }
          - name: canonical
            label: Canonical URL
            type: string
            display: { component: url }
          - name: noindex
            label: Hide from search engines
            type: boolean
            display: { component: switch }
          # A media reference again, under a different name — merge key.
          - <<: *mediaRef
            name: image
            label: Social share image
          - name: keywords
            label: Keywords
            type: array
            of: string
            display: { component: list }

      - name: body
        label: Body
        type: string
        display: { component: body, source: body, format: markdown, flavor: gfm }

  # ── Projects ──────────────────────────────────────────────────────────────
  # Block-based like the homepage, but with structured metadata on top: the
  # list page filters and groups on these, so they are real fields rather than
  # something buried in a block.
  - name: projects
    label: "{{title}}"
    path: "src/content/projects/*.md"
    filename: "{{slug}}"
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        display: { component: slug }

      - name: summary
        label: Summary
        type: string
        display: { component: textarea }

      - name: year
        label: Year
        type: integer
        min: 1990
        max: 2100
        display: { component: number }

      - name: role
        label: Role
        type: string

      - name: status
        label: Status
        type: string
        enum: ["in-progress", "shipped", "archived"]
        display: { component: select }

      - name: url
        label: Live URL
        type: string
        display: { component: url }

      - name: tags
        label: Tags
        type: array
        of: string
        display: { component: list }

      - name: featured
        label: Feature on the homepage
        type: boolean
        display: { component: switch }

      - <<: *mediaRef
        name: thumbnail
        label: Thumbnail

      # The project page is composed rather than written straight through.
      - name: blocks
        label: Page blocks
        type: array
        display: { component: mixedList }
        variants:
          - name: richText
            label: Rich text
            fields:
              - name: heading
                label: Heading
                type: string
              - name: body
                label: Body
                type: string
                display: { component: body, source: field, format: markdown, flavor: gfm }

          - name: figure
            label: Figure
            fields:
              - <<: *mediaRef
                name: image
                label: Image
              - name: caption
                label: Caption
                type: string

          - name: metrics
            label: Metrics
            fields:
              - name: items
                label: Metrics
                type: array
                display: { component: list }
                of: object
                fields:
                  - name: label
                    type: string
                  - name: value
                    type: string

          # FIRST USE of the CTA block. The homepage aliases it below, so the
          # two surfaces cannot drift into two slightly different CTAs.
          - &ctaBlock
            name: cta
            label: Call to action
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: body
                label: Body
                type: string
                display: { component: textarea }
              - name: buttonLabel
                label: Button label
                type: string
              - name: buttonHref
                label: Button link
                type: string
                display: { component: url }
              # …or a page of this site instead of a URL. The object form
              # stores the target's key under `ref` and, beside it, two copies
              # the CMS keeps current: its title, and its URL rendered from the
              # collection and slug. The site links without a join, and a slug
              # change on the article rewrites every CTA pointing at it in the
              # same commit. Deleting a page a CTA links to is refused, naming
              # the page that links to it (the default, restrict). When both a
              # page and a URL are set, the page wins.
              # The children are declared, as a media object's are: the key
              # child plus one per embed, each checked against the targets on
              # import (title copies a string on both collections; href is a
              # template, so it must be a string).
              - name: buttonPage
                label: Or link to a page
                type: object
                display: { component: reference }
                fields:
                  - { name: ref, type: string }
                  - { name: title, type: string }
                  - { name: href, type: string }
                reference:
                  collections: [articles, projects]
                  embed:
                    title: title
                    href: "/{{_collection}}/{{slug}}/"

      - *seo

      - name: body
        label: Notes
        type: string
        display: { component: body, source: body, format: markdown, flavor: gfm }

  # ── Homepage ──────────────────────────────────────────────────────────────
  # A singleton: the path has no wildcard, so the CMS offers get and update and
  # nothing else. There is one homepage; it cannot be created or deleted.
  - name: home
    label: Homepage
    path: "src/content/pages/home.yml"
    fields:
      - name: blocks
        label: Page blocks
        type: array
        min_items: 1
        display: { component: mixedList }
        variants:
          - name: hero
            label: Hero
            fields:
              - name: eyebrow
                label: Eyebrow
                type: string
              - name: heading
                label: Heading
                type: string
                required: true
              - name: subheading
                label: Subheading
                type: string
                display: { component: textarea }
              - <<: *mediaRef
                name: portrait
                label: Portrait
              - name: primaryLabel
                label: Primary button label
                type: string
              - name: primaryHref
                label: Primary button link
                type: string
              - name: secondaryLabel
                label: Secondary button label
                type: string
              - name: secondaryHref
                label: Secondary button link
                type: string

          - name: featuredArticles
            label: Featured articles
            fields:
              - name: heading
                label: Heading
                type: string
              - name: intro
                label: Intro
                type: string
                display: { component: textarea }
              - name: limit
                label: How many to show
                type: integer
                min: 1
                max: 12
                display: { component: stepper }

          - name: featuredProjects
            label: Featured projects
            fields:
              - name: heading
                label: Heading
                type: string
              - name: intro
                label: Intro
                type: string
                display: { component: textarea }
              - name: limit
                label: How many to show
                type: integer
                min: 1
                max: 12
                display: { component: stepper }

          # The same CTA the project pages use.
          - *ctaBlock

          - name: footer
            label: Footer
            fields:
              - name: tagline
                label: Tagline
                type: string
              - name: links
                label: Links
                type: array
                display: { component: list }
                of: object
                fields:
                  - name: label
                    type: string
                  - name: href
                    type: string

      - *seo

  # ── About ─────────────────────────────────────────────────────────────────
  # The one page that is prose rather than blocks, because an about page is an
  # essay and forcing it through a block builder helps nobody.
  - name: about
    label: About
    path: "src/content/pages/about.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: intro
        label: Intro
        type: string
        display: { component: textarea }

      - <<: *mediaRef
        name: portrait
        label: Portrait

      - name: body
        label: Body
        type: string
        display: { component: body, source: body, format: markdown, flavor: gfm }

      - *seo

# ── Forms ───────────────────────────────────────────────────────────────────
#
# What the site COLLECTS, as opposed to what it publishes. A form is declared
# here and the CMS exposes it on the content API; the site renders its own
# markup and posts to it, over JSON or as a plain browser form.
#
# Two forms, chosen to exercise the parts of the feature that differ.
forms:
  # A contact form: conditional fields, per-rule messages, and submissions
  # versioned into the repository.
  - name: contact
    label: Contact
    description: General enquiries from the site's contact page.

    # Everyone may submit — that is what a form is for. Reading the submissions
    # is the inverse: omitting `read` would already deny the public, and naming
    # the roles says who in the workspace is expected to answer them.
    read: ["editor"]
    delete: ["admin"]

    # Versioned in git. Sharded by month so the directory a year from now is
    # still something a person can open, and `_id` in the name is what makes a
    # collision impossible.
    store:
      path: "src/content/submissions/contact/**/*.json"
      # slugify, not the raw timestamp: an RFC3339 time contains colons, which
      # are legal in a file name on macOS and Linux and not on Windows — so the
      # obvious `{{submittedAt}}-{{_id}}` writes a repository that cannot be
      # checked out on a third of the machines that might clone it. Slugified it
      # is still sortable and still readable, which was the point of putting the
      # time in the name at all.
      filename: "{{slugify submittedAt}}-{{_id}}"

    # A field the form never asks for. A submission that fills it in is recorded
    # as spam and answered normally, so a bot learns nothing.
    honeypot: company
    rate_limit: { per_minute: 5 }
    redirect_to: /thanks

    fields:
      - name: name
        label: Your name
        type: string
        required: true
        validate:
          - { rule: maxLength, value: 120 }

      - name: email
        label: Email
        type: string
        required: true
        display: { component: email }
        validate:
          - rule: email
            message: "We need an address that works, or we can't reply."

      - name: reason
        label: What's this about?
        type: string
        required: true
        enum: [hiring, project, other]
        display: { component: select }

      # Only asked for — and only accepted — when the reason is a project. A
      # submission that supplies it anyway is rejected rather than stored, so
      # the record cannot contradict the rules it passed.
      - name: budget
        label: Rough budget
        type: integer
        display: { component: number }
        when: { field: reason, op: eq, value: project }
        validate:
          - { rule: min, value: 0 }

      - name: message
        label: Message
        type: string
        required: true
        display: { component: textarea }
        validate:
          - { rule: minLength, value: 20, message: "A sentence or two, please." }
          - { rule: maxLength, value: 5000 }

  # A newsletter signup: database-only, because an email list does not belong in
  # a public repository and nobody wants a commit per subscriber.
  - name: newsletter
    label: Newsletter
    description: Email signups from the site footer.
    read: ["editor"]
    honeypot: website
    rate_limit: { per_minute: 10 }
    fields:
      - name: email
        label: Email
        type: string
        required: true
        display: { component: email }
        validate:
          - { rule: email }
      - name: consent
        label: Agreed to be emailed
        type: boolean
        required: true
        display: { component: checkbox }
